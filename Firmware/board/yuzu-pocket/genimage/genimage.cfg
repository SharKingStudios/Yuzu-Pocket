image boot.vfat {
	vfat {
		files = {
			"zImage",
			"sun8i-v3lp-yuzu-pocket.dtb",
			"boot.scr",
			"extlinux",
			"HOW_TO_USE.txt",
			"YUZU_POCKET_TERMINAL.url",
			"YUZU_POCKET_TERMINAL.webloc"
		}
	}

	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = "no"
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
